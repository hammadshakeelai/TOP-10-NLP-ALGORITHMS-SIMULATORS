name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web-ui/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, matching local development. npm 10 (Node 20)
      # disagrees with this lockfile about optional peer deps and fails
      # `npm ci` on yaml@2, an optional peer of postcss-load-config.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - run: npm ci

      - name: Build backend-free bundle
        env:
          # No API calls are attempted; the UI serves src/mocks/ snapshots.
          VITE_STATIC_MODE: "true"
          # Project Pages sites are served from /<repo>/.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
