<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Interactive simulator platform for the top NLP algorithms — tokenization, TF-IDF, Naive Bayes, BERT, GPT, T5 and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NLP Algorithm Simulator" />
    <meta
      property="og:description"
      content="Run the top NLP algorithms step-by-step in your browser — formulas, pipeline traces, visualizations and references included."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NLP Algorithm Simulator</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem("nlp-theme");
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add(theme === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center;">
        This simulator runs entirely in your browser and requires JavaScript.
        Please enable JavaScript to continue.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
